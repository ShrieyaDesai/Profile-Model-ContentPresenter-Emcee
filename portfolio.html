<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Shrieya Desai</title>
<meta name="description" content="Shrieya Desai — Acting, Content Presenting & Hosting portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- LOADING / ERROR STATES (data is fetched live from Google Sheets) -->
<div class="status-screen status-screen--loading" id="loadingScreen">
  <div class="status-screen__spinner"></div>
  <p>Loading…</p>
</div>
<div class="status-screen status-screen--error" id="errorScreen" hidden>
  <div class="status-screen__box">
    <h2>Couldn't load site content</h2>
    <p id="errorMessage"></p>
    <button class="btn btn--primary" id="errorRetry">Retry</button>
  </div>
</div>

<!-- background layers -->
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-orb bg-orb--a" aria-hidden="true"></div>
<div class="bg-orb bg-orb--b" aria-hidden="true"></div>
<div class="bg-noise" aria-hidden="true"></div>

<header class="nav" id="nav">
  <div class="nav__inner">
    <a href="index.html" class="nav__brand" id="navBrand">Your Name</a>
    <nav class="nav__links" id="navLinks">
      <a href="index.html#about">About</a>
      <a href="portfolio.html" class="is-active">Portfolio</a>
      <a href="index.html#gallery">Gallery</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <svg width="24" height="24"><use href="#icon-menu"/></svg>
    </button>
  </div>
</header>

<main id="top">

  <!-- DISCIPLINES -->
  <section class="section section--portfolio-page" id="disciplines">
    <a class="back-home reveal" href="index.html">
      <svg width="16" height="16" style="transform:rotate(180deg)"><use href="#icon-arrow"/></svg>
      Back to Home
    </a>
    <div class="section__head reveal">
      <p class="kicker">Page Navigation</p>
      <h2 class="section__title">Portfolio</h2>
    </div>
    <div class="quicknav quicknav--section reveal" id="portfolioNav"></div>
    <div class="groups" id="disciplineCards"></div>
  </section>

  <!-- CONTACT -->
  <section class="section section--contact" id="contact">
    <div class="contact__panel reveal">
      <p class="kicker" id="contactKicker"></p>
      <h2 class="section__title" id="contactHeading"></h2>
      <p class="section__desc" id="contactDesc"></p>
      <div class="contact__details" id="contactDetails"></div>
      <div class="social" id="socialLinks"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <p id="footerText"></p>
  <button class="to-top" id="toTop" aria-label="Back to top">
    <svg width="18" height="18" style="transform:rotate(-90deg)"><use href="#icon-arrow"/></svg>
  </button>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__close" id="lightboxClose" aria-label="Close"><svg width="26" height="26"><use href="#icon-close"/></svg></button>
  <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous"><svg width="26" height="26" style="transform:rotate(180deg)"><use href="#icon-arrow"/></svg></button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next"><svg width="26" height="26"><use href="#icon-arrow"/></svg></button>
  <p class="lightbox__caption" id="lightboxCaption"></p>
</div>

<!-- VIDEO MODAL -->
<div class="video-modal" id="videoModal" hidden>
  <button class="lightbox__close" id="videoModalClose" aria-label="Close"><svg width="26" height="26"><use href="#icon-close"/></svg></button>
  <div class="video-modal__frame">
    <iframe id="videoModalFrame" src="" title="Video" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<!-- MEDIA MODAL (Show More: photos + video + reels for one project) -->
<div class="media-modal" id="mediaModal" hidden>
  <div class="media-modal__panel">
    <div class="media-modal__head">
      <h3 id="mediaModalTitle"></h3>
      <button class="lightbox__close media-modal__close" id="mediaModalClose" aria-label="Close"><svg width="22" height="22"><use href="#icon-close"/></svg></button>
    </div>
    <div class="media-modal__body" id="mediaModalBody"></div>
  </div>
</div>

<!-- REEL MODAL -->
<div class="video-modal" id="reelModal" hidden>
  <button class="lightbox__close" id="reelModalClose" aria-label="Close"><svg width="26" height="26"><use href="#icon-close"/></svg></button>
  <div class="reel-modal__frame" id="reelModalContent"></div>
</div>

<script src="js/content.js"></script>
<script src="js/sheets-config.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/script.js"></script>
</body>
</html>
